<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Tin Cá Nhân</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: bold;
            color: #000;
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.6);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .title {
            font-size: 14px;
            color: #00f2fe;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }
        .bio {
            font-size: 14px;
            color: #cccccc;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            display: block;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn:hover {
            background: #4facfe;
            color: #000;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">P</div>
        <h1>Nguyễn Gia Phú</h1>
        <div class="title">Developer / Modder</div>
        
        <p class="bio">
            Chào mừng đến với không gian của mình! <br>
            Đam mê lập trình, thiết kế và chia sẻ các dự án mã nguồn mở.
        </p>

        <div class="links">
            <a href="https://facebook.com/your_profile" class="btn" target="_blank">Facebook</a>
            <a href="https://zalo.me/your_phone" class="btn" target="_blank">Zalo</a>
            <a href="https://github.com/nguyengiaphumatr-ctrl" class="btn" target="_blank">GitHub</a>
        </div>
    </div>

</body>
</html>
