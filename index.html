
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NICOLAFFVN</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #fff;
    color: #101828;
}

.lightning {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.bolt {
    position: absolute;
    width: 4px;
    height: 220px;
    background: #00c8ff;
    clip-path: polygon(50% 0,100% 0,40% 43%,100% 43%,0 100%,35% 55%,0 55%);
    filter: drop-shadow(0 0 8px #00aaff);
    animation: flash 3s infinite;
    opacity: 0;
}

.bolt:nth-child(1) {
    left: 12%;
    top: 8%;
}

.bolt:nth-child(2) {
    left: 85%;
    top: 15%;
    animation-delay: .8s;
}

.bolt:nth-child(3) {
    left: 25%;
    top: 65%;
    animation-delay: 1.5s;
}

.bolt:nth-child(4) {
    left: 75%;
    top: 60%;
    animation-delay: 2s;
}

@keyframes flash {
    0%,84%,100% { opacity: 0; }
    86%,90% { opacity: 1; }
    88% { opacity: .2; }
    94% { opacity: 0; }
}

.glow {
    position: fixed;
    width: 260px;
    height: 260px;
    background: rgba(0,153,255,.12);
    filter: blur(85px);
    border-radius: 50%;
    pointer-events: none;
}

.glow.one {
    top: -100px;
    left: -100px;
}

.glow.two {
    right: -100px;
    bottom: -100px;
}

.card {
    position: relative;
    z-index: 1;
    width: min(90%,420px);
    padding: 38px 25px;
    text-align: center;
    border-radius: 26px;
    background: rgba(255,255,255,.95);
    border: 1px solid #d9f2ff;
    box-shadow: 0 15px 55px rgba(0,145,255,.13);
}

.logo {
    width: 82px;
    height: 82px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 24px;
    color: white;
    font-size: 28px;
    font-weight: 900;
    background: linear-gradient(135deg,#00d4ff,#0066ff);
    box-shadow: 0 0 28px rgba(0,145,255,.4);
}

h1 {
    font-size: 29px;
    font-weight: 900;
    letter-spacing: 1px;
}

h1 span {
    color: #008cff;
}

.subtitle {
    margin-top: 13px;
    color: #68778a;
    font-size: 14px;
    line-height: 1.8;
}

.line {
    height: 3px;
    width: 65px;
    margin: 24px auto;
    border-radius: 10px;
    background: linear-gradient(90deg,#00d4ff,#0066ff);
    box-shadow: 0 0 14px #00aaff;
}

.contact {
    display: block;
    padding: 16px;
    margin-top: 13px;
    text-decoration: none;
    color: #152238;
    font-size: 15px;
    font-weight: 700;
    border-radius: 14px;
    border: 1px solid #e0f2ff;
    background: #f8fcff;
    transition: .3s;
}

.contact span {
    color: #008cff;
    margin-right: 8px;
}

.contact:hover {
    transform: translateY(-3px);
    border-color: #00aaff;
    box-shadow: 0 6px 22px rgba(0,145,255,.16);
}

.credit {
    margin-top: 26px;
    color: #8793a4;
    font-size: 12px;
    letter-spacing: 1px;
}

.credit strong {
    display: block;
    color: #007fff;
    margin-top: 8px;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="glow one"></div>
<div class="glow two"></div>

<div class="lightning">
    <div class="bolt"></div>
    <div class="bolt"></div>
    <div class="bolt"></div>
    <div class="bolt"></div>
</div>

<main class="card">
    <div class="logo">N+</div>

    <h1>NICOLAFFVN<span>.</span></h1>

    <p class="subtitle">
        Kết nối với chúng tôi<br>
        Hiện đại · Nhanh chóng · Chuyên nghiệp
    </p>

    <div class="line"></div>

    <a class="contact"
       href="https://www.facebook.com/"
       target="_blank"
       rel="noopener noreferrer">
        <span>✦</span> Facebook liên hệ
    </a>

    <a class="contact"
       href="https://www.tiktok.com/"
       target="_blank"
       rel="noopener noreferrer">
        <span>✦</span> TikTok liên hệ
    </a>

    <a class="contact"
       href="https://zalo.me/"
       target="_blank"
       rel="noopener noreferrer">
        <span>✦</span> Zalo liên hệ
    </a>

    <div class="credit">
        DESIGNED BY
        <strong>NICOLAFFVN Nguyễn Gia Phú</strong>
    </div>
</main>

</body>
</html>
