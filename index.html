<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NICOLAFFVN | Nguyễn Gia Phú</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        min-height: 100vh;
        padding: 25px 14px;
        background: radial-gradient(ellipse at top, #123b80 0%, #071426 45%, #02040a 100%);
        color: white;
        font-family: "Segoe UI", Arial, sans-serif;
    }
    .container {
        width: min(100%, 460px);
        margin: auto;
    }
    .profile {
        border-radius: 24px;
        border: 1px solid #00bfff;
        box-shadow: 0 0 30px #007bff50;
        background: #071426;
        width: 100%;
        aspect-ratio: 1 / 1;
        overflow: hidden;
    }
    .profile img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
    .header { text-align: center; padding: 23px 5px; }
    .header h1 { font-size: 32px; font-weight: 900; }
    .header h1 span { color: #00d9ff; }
    .header p { color: #b1c7e8; margin-top: 10px; font-size: 13px; }
    .links { display: grid; gap: 13px; }
    .contact {
        display: flex; align-items: center; gap: 13px; padding: 14px;
        border: 1px solid #244c79; border-radius: 16px;
        background: linear-gradient(110deg, #0d203b, #07101e);
        color: white; text-decoration: none;
    }
    .icon { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; background: #00d9ff; font-weight: bold; font-size: 20px; color: #000; }
    .qr-card { margin-top: 20px; padding: 18px; background: white; color: #111827; border-radius: 20px; text-align: center; }
    .qr-card img { width: min(100%, 300px); display: block; margin: 10px auto; }
</style>
</head>
<body>

<main class="container">
    <section class="profile">
        <img src="./avatar.jpg" onerror="this.src='./avatar.png'" alt="Avatar">
    </section>

    <header class="header">
        <h1>NICOLAFFVN<span>.</span></h1>
        <p>KẾT NỐI VỚI TÔI<br>Hiện đại · Nhanh chóng · Chuyên nghiệp</p>
    </header>

    <nav class="links">
        <a class="contact" href="https://www.facebook.com/share/1Fcp7E2HaQ/" target="_blank">
            <span class="icon">f</span>
            <span><strong>Facebook</strong><br><small>Trang Facebook liên hệ</small></span>
        </a>
        <a class="contact" href="https://www.tiktok.com/@nicolaffcreator" target="_blank">
            <span class="icon">♪</span>
            <span><strong>Kênh TikTok 1</strong><br><small>Nhấn để chuyển đến kênh</small></span>
        </a>
        <a class="contact" href="https://www.tiktok.com/@nicolaffvnclone" target="_blank">
            <span class="icon">♪</span>
            <span><strong>Kênh TikTok 2</strong><br><small>Nhấn để chuyển đến kênh</small></span>
        </a>
    </nav>

    <section class="qr-card">
        <h2>Liên hệ qua Zalo</h2>
        <p>Quét mã QR bên dưới để kết nối.</p>
        <img src="./zalo-qr.jpg" onerror="this.src='./zalo-qr.png'" alt="Mã QR Zalo">
        <p style="margin-top: 10px; font-weight: bold;">QUÉT MÃ QR ĐỂ KẾT NỐI</p>
    </section>
</main>

</body>
</html>
